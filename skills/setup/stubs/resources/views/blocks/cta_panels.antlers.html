<section class="grid md:grid-cols-2">
    {{ panels }}
        <div class="{{ if style == 'brand' }}bg-brand{{ else }}bg-deep{{ /if }} px-8 py-16 sm:px-12 lg:px-14 lg:py-20">
            <div class="mx-auto max-w-md md:mx-0">
                {{ if title }}
                    <h2 class="rule-accent font-display text-2xl font-bold text-white uppercase">
                        {{ title }}
                    </h2>
                {{ /if }}

                {{ if body }}
                    <p class="mt-4 text-[15px] leading-relaxed text-white/75">
                        {{ body }}
                    </p>
                {{ /if }}

                {{ if buttons }}
                    <div class="mt-8 flex flex-col gap-3 sm:max-w-xs">
                        {{ buttons }}
                            <a
                                href="{{ url }}"
                                class="bg-accent px-6 py-3.5 text-center font-display text-sm font-bold tracking-[0.08em] text-white uppercase transition hover:bg-white hover:text-ink"
                            >
                                {{ label }}
                            </a>
                        {{ /buttons }}
                    </div>
                {{ /if }}
            </div>
        </div>
    {{ /panels }}
</section>
