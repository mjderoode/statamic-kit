title: Pagina
tabs:
  main:
    display: Inhoud
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Titel
              required: true
          -
            import: page_blocks
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'SEO-titel'
              character_limit: 60
          -
            handle: meta_description
            field:
              type: textarea
              display: 'SEO-omschrijving'
              character_limit: 160
